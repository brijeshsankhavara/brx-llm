name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # oldest supported versions
          - python: "3.10"
            torch: "torch==2.3.0"
            transformers: "transformers==4.40.2"
          # latest versions
          - python: "3.12"
            torch: "torch"
            transformers: "transformers"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          pip install "${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu
          pip install "${{ matrix.transformers }}" -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest -q
