# ~10M-parameter model on TinyStories. Trains on a laptop GPU (Apple MPS) or a free Colab T4.
model:
  hidden_size: 256
  intermediate_size: 768
  num_hidden_layers: 6
  num_attention_heads: 8
  num_key_value_heads: 2
  max_position_embeddings: 256
  tie_word_embeddings: true

data:
  dataset: roneneldan/TinyStories
  text_column: text
  train_split: train
  eval_split: validation
  max_train_samples: 200000
  max_eval_samples: 2000
  tokenizer: TinyLlama/TinyLlama-1.1B-Chat-v1.0  # Llama BPE tokenizer, 32k vocab
  context_length: 256

training:  # passed to transformers.TrainingArguments
  output_dir: runs/brx-tiny
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 1
  max_steps: 3000
  learning_rate: 1.0e-3
  lr_scheduler_type: cosine
  warmup_steps: 200
  weight_decay: 0.1
  max_grad_norm: 1.0
  logging_steps: 25
  eval_strategy: steps
  eval_steps: 500
  save_steps: 1000
  save_total_limit: 1
  report_to: none
  seed: 64
