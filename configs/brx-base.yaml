# The original BRX architecture (~117M parameters) on Python code from CodeParrot. Needs a CUDA GPU.
model:
  hidden_size: 1024
  intermediate_size: 2048
  num_hidden_layers: 6
  num_attention_heads: 16
  num_key_value_heads: 2
  max_position_embeddings: 2048

data:
  dataset: huggingface-course/codeparrot-ds-train
  text_column: content
  train_split: train
  max_train_samples: 60000
  tokenizer: TinyLlama/TinyLlama-1.1B-Chat-v1.0
  context_length: 1024

training:  # passed to transformers.TrainingArguments
  output_dir: runs/brx-base
  per_device_train_batch_size: 32
  gradient_accumulation_steps: 2
  max_steps: 2000
  learning_rate: 5.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 1000
  weight_decay: 0.1
  logging_steps: 10
  save_steps: 500
  fp16: true
  report_to: none
  seed: 64
